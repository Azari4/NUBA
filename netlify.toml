[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_USER,WHATSAPP_NUMBER"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "sqlite3"]
  included_files = ["migrations/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
